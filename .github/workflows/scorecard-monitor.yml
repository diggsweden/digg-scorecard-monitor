name: OpenSSF Scorecard Monitor

on:
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scorecard-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OpenSSF Scorecard Monitor
        uses: ossf/scorecard-monitor@v2.0.0-beta8
        with:
          scope: reporting/scope.json
          database: reporting/database.json
          report: reporting/openssf-scorecard-report.md
          auto-commit: false
          auto-push: false
          generate-issue: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          discovery-enabled: true
          discovery-orgs: diggsweden
          max-request-in-parallel: 10
          report-tool: "scorecard-visualizer"

      - name: Remove StepSecurity column from report
        run: |
          if [ -f reporting/openssf-scorecard-report.md ]; then
            sed -i 's/ | StepSecurity |$/ |/' reporting/openssf-scorecard-report.md
            sed -i 's/ | -- |$/ |/' reporting/openssf-scorecard-report.md
            sed -i 's/ | \[Fix it\]([^)]*) |$/ |/' reporting/openssf-scorecard-report.md
            npx --yes prettier --write reporting/openssf-scorecard-report.md
          fi

      - name: Append repos without scorecard to report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/append_repos_without_scorecard
          ./scripts/append_repos_without_scorecard

      - name: Sort report alphabetically
        run: |
          python3 <<'PYEOF'
          import re

          report = "reporting/openssf-scorecard-report.md"
          with open(report) as f:
              lines = f.readlines()

          sep_idx = None
          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("|") and re.match(r"^[\|\-\s:]+$", stripped) and "-" in stripped:
                  sep_idx = i
                  break

          if sep_idx is None:
              print("No separator found, skipping sort.")
              exit(0)

          last_row = sep_idx
          for i in range(sep_idx + 1, len(lines)):
              if lines[i].strip().startswith("|"):
                  last_row = i

          data = lines[sep_idx + 1 : last_row + 1]
          data.sort(key=lambda r: r.strip().lower())
          lines[sep_idx + 1 : last_row + 1] = data

          with open(report, "w") as f:
              f.writelines(lines)

          print(f"Sorted {len(data)} rows.")
          PYEOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reporting/
          git diff --cached --quiet || git commit -m "chore: update scorecard report"
          git push